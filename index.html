<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gatinho Pomodoro</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/panels.css">
  <link rel="stylesheet" href="css/cat.css">
</head>
<body>

  <!-- Aparece só quando o app está na janela flutuante -->
  <div class="landing">
    <p>📌 O gatinho está na janela flutuante.</p>
    <button id="unpin" type="button" class="btn">Trazer de volta</button>
  </div>

  <main id="app" class="app" data-timer="idle" data-alive="true">

    <header class="top">
      <span id="cat-name" class="top__name">Gatinho</span>
      <span class="stat" title="Pontos"><i class="stat__ico" aria-hidden="true">⭐</i><b id="score">0</b></span>
      <span class="stat stat--muted" title="Recorde"><i class="stat__ico" aria-hidden="true">🏆</i><b id="record">0</b></span>
      <span class="stat" title="Moedas"><i class="stat__ico" aria-hidden="true">🪙</i><b id="coins">0</b></span>
      <span class="top__right">
        <button type="button" class="btn btn--icon" data-panel="update" title="Atualizações" aria-label="Atualizações" aria-pressed="false">🔄<i class="badge" hidden></i></button>
        <button type="button" class="btn btn--icon top__pin" data-command="pin" title="Fixar acima das outras janelas" aria-label="Fixar acima das outras janelas">📌</button>
      </span>
    </header>

    <section class="stage">

      <button type="button" id="light-switch" class="btn btn--icon stage__light" data-command="light" title="Acender / apagar a luz" hidden>💡</button>
      <span id="toolbar" class="toolbar"></span>
      <div id="music-mini" class="stage__music" hidden>
        <button type="button" class="btn btn--icon btn--tiny" data-music="toggle" title="Tocar/pausar">▶</button>
        <button type="button" class="btn btn--icon btn--tiny" data-music="next" title="Próxima">⏭</button>
        <span id="music-mini-title" class="ellipsis"></span>
      </div>
      <div id="bubble" class="stage__bubble" hidden></div>
    </section>

    <section class="strip" aria-label="Cenários">
      <button type="button" class="strip__arrow" data-strip="-1" aria-label="Cenários anteriores" hidden>◀</button>
      <div id="strip-list" class="strip__list"></div>
      <button type="button" class="strip__arrow" data-strip="1" aria-label="Próximos cenários" hidden>▶</button>
      <button type="button" class="btn btn--icon strip__edit" data-command="edit" aria-pressed="false" title="Mobiliar o cenário (arraste os móveis)">🪑</button>
    </section>

    <p id="message" class="message"></p>

    <section id="needs" class="needs" aria-label="Necessidades do gatinho"></section>

    <section class="timer" aria-label="Timer pomodoro">
      <div id="clock" class="timer__clock">25:00</div>
      <div id="timer-label" class="timer__label"></div>
      <div class="timer__progress" role="progressbar" aria-label="Progresso do foco" aria-valuemin="0" aria-valuemax="100"><i></i></div>

      <form id="timer-form" class="timer__form" data-when="idle">
        <input id="task" class="field field--grow" type="text" maxlength="60" placeholder="O que vai fazer?" autocomplete="off">
        <input id="minutes" class="field field--minutes" type="number" min="1" max="180" value="25" aria-label="Minutos">
        <button type="submit" class="btn btn--primary">Iniciar</button>
      </form>

      <div id="presets" class="timer__row" data-when="idle"></div>

      <div id="habit" class="habit" hidden><span id="habit-text"></span><button type="button" class="btn btn--small btn--primary" data-command="habit">Fiz! ✅</button></div>

      <div class="timer__row" data-when="running paused">
        <button type="button" class="btn" data-command="pause">⏸ Pausar</button>
        <button type="button" class="btn" data-command="cancel">✖ Cancelar</button>
      </div>
    </section>

    <section id="actions" class="actions" aria-label="Cuidados"></section>
    <button type="button" class="btn btn--primary" data-command="revive" hidden>✨ Reviver o gatinho</button>

    <!-- Janelinha única: o conteúdo muda conforme o ícone clicado na barra do topo -->
    <section id="panel" class="panel" tabindex="-1" hidden>
      <header class="panel__head">
        <h2 id="panel-title"></h2>
        <button type="button" class="btn btn--small" data-panel-close title="Fechar (Esc)">✕</button>
      </header>
      <div id="panel-body" class="panel__body"></div>
    </section>

    <!-- Escolha do felino (primeiro uso e ao reviver): cobre o app até confirmar -->
    <section id="setup" class="setup" hidden>
      <form id="setup-form" class="setup__card">
        <div class="setup__cat" aria-hidden="true">🐱</div>
        <h2 id="setup-title">Adote seu gatinho 🐾</h2>
        <p class="setup__hint">Escolha o gênero e o nome do seu felino.</p>
        <div class="setup__genders">
          <button type="button" class="btn gender" data-gender="m" aria-pressed="false"><span>♂</span> Macho</button>
          <button type="button" class="btn gender" data-gender="f" aria-pressed="false"><span>♀</span> Fêmea</button>
        </div>
        <div class="setup__name">
          <input id="setup-name" class="field field--grow" type="text" maxlength="14" placeholder="Nome do felino" autocomplete="off">
          <button type="button" class="btn" id="setup-dice" title="Sugerir um nome">🎲</button>
        </div>
        <p id="setup-error" class="note"></p>
        <div class="setup__actions">
          <button type="button" class="btn" id="setup-cancel" hidden>Cancelar</button>
          <button type="submit" class="btn btn--primary" id="setup-go" disabled>Começar</button>
        </div>
      </form>
    </section>
  </main>

  <!-- O vídeo do YouTube fica aqui, fora do app, para a música não recarregar ao mexer nos painéis -->
  <div id="music-host" class="music-host"><div id="music-mount"></div></div>

</body>
